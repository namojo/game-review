<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리뷰 검수함 | 원시인 형님들 키우기</title>
  <meta name="description" content="원시인 형님들 키우기 Google Play·App Store 리뷰를 분류·번역하고 AI 답변 초안을 검수하는 PoC 화면">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    // 첫 페인트 전에 저장된 테마를 적용한다(깜박임 방지).
    try { var t = localStorage.getItem('tgr.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#view">본문으로 건너뛰기</a>
  <header class="topbar">
    <div class="brand">
      <img class="brand-icon" src="assets/icon.png" width="44" height="44" alt="">
      <div class="brand-text">
        <span class="plaque">원시인 형님들 키우기</span>
        <span class="brand-sub">리뷰 검수함 <span id="collected" class="collected"></span></span>
      </div>
    </div>
    <nav class="tabs" aria-label="화면">
      <a href="#/dashboard" data-tab="dashboard">대시보드</a>
      <a href="#/inbox" data-tab="inbox">검수 인박스</a>
      <a href="#/guide" data-tab="guide">운영 가이드</a>
      <a href="#/settings" data-tab="settings">설정</a>
    </nav>
    <button id="theme-toggle" class="icon-btn theme-toggle" type="button" aria-label="다크 모드로 전환">
      <svg class="i-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1">
    <p class="loading">리뷰 데이터를 불러오는 중입니다.</p>
  </main>

  <footer class="footer">
    <p>썬더게임즈 AI 전환 컨설팅 PoC — 공개 리뷰 데이터 기반, 실제 스토어에 답변을 등록하지 않음</p>
    <p class="footer-sub">작성자 이름은 수집 단계에서 지웠습니다. 검수 상태와 API 키는 이 브라우저에만 저장됩니다.</p>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="tooltip" class="tooltip" role="presentation" hidden></div>

  <noscript><p class="load-error">이 화면은 JavaScript가 필요합니다. 브라우저 설정에서 JavaScript를 켜세요.</p></noscript>
  <script>
    // file:// 로 열면 ES 모듈과 데이터 fetch 가 모두 막힌다. 모듈이 돌지 않아도 원인을 보여준다.
    if (location.protocol === 'file:') {
      document.getElementById('view').innerHTML = '<section class="load-error"><h1>리뷰 데이터를 불러오지 못했습니다</h1>' +
        '<p>브라우저는 <code>file://</code> 로 연 페이지가 스크립트 모듈과 데이터 파일을 읽지 못하게 막습니다. 로컬 서버를 띄운 뒤 주소로 여세요.</p>' +
        '<pre>python3 -m http.server -d game-review 8765\n# 브라우저에서 http://localhost:8765/ 열기</pre></section>';
    }
  </script>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
